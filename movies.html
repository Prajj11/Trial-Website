<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Movies | CineVault</title>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="referrer" content="no-referrer"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"/>
  


  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading CineVault...</div>
</div>

<!-- ======================== PARTICLES BG ======================== -->
<canvas id="particles-canvas" aria-hidden="true"></canvas>

<!-- ======================== NAV ======================== -->
<nav class="navbar scrolled" id="navbar" role="navigation">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-icon" aria-hidden="true">🎬</span>
      <span class="logo-text">CineVault</span>
    </a>

    <!-- Fixed search bar overlap visually: Added z-index and spacing constraints -->
    <div class="hero-search-wrap" role="search" style="flex:1; max-width: 400px; margin:0 24px; position: relative; z-index: 50; animation: none; transform:none; opacity:1;">
      <div class="search-box" id="search-box" style="height: 44px; padding: 4px 16px;">
        <span class="search-icon" aria-hidden="true" style="font-size:1rem;">🔍</span>
        <input type="search" id="hero-search" placeholder="Search movies..." autocomplete="off"/>
        <button class="search-clear" id="search-clear" style="display:none; width:24px; height:24px; font-size:0.8rem;">✕</button>
      </div>
      <div class="search-suggestions" id="search-suggestions" role="listbox" style="top: 50px;"></div>
    </div>

    <div class="nav-links" id="nav-links">
      <a href="index.html#home"        class="nav-link">Home</a>
      <a href="movies.html"            class="nav-link active">Browse Movies</a>
      <a href="index.html#by-language" class="nav-link">Languages</a>
      <a href="index.html#watchlist"   class="nav-link">
        Watchlist <span class="wl-badge" id="nav-wl-badge" style="display:none">0</span>
      </a>
    </div>

    <div class="nav-actions">
      <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon" id="theme-icon">🌙</span>
      </button>
      <button class="icon-btn" id="mobile-menu-btn" aria-label="Open menu">☰</button>
    </div>
  </div>
</nav>

<!-- Mobile Drawer -->
<div class="mobile-drawer" id="mobile-drawer" role="dialog">
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="drawer-panel">
    <div class="drawer-header">
      <span class="logo-text" style="font-size:1.3rem;font-weight:800">🎬 CineVault</span>
      <button class="icon-btn" id="drawer-close">✕</button>
    </div>
    <nav class="drawer-nav">
      <a href="index.html#home"        class="drawer-link" onclick="closeDrawer()">🏠 Home</a>
      <a href="movies.html"            class="drawer-link active" onclick="closeDrawer()">🎥 Browse Movies</a>
      <a href="index.html#by-language" class="drawer-link" onclick="closeDrawer()">🌍 By Language</a>
      <a href="index.html#watchlist"   class="drawer-link" onclick="closeDrawer()">❤️ Watchlist</a>
    </nav>
    <div class="drawer-footer">
      <button class="theme-toggle-full" id="drawer-theme-btn">🌙 Toggle Theme</button>
    </div>
  </div>
</div>

<!-- ======================== BROWSE ======================== -->
<section class="section browse-section" style="padding-top: 100px; min-height: 80vh;" id="browse" aria-labelledby="browse-title">
  <div class="section-header">
    <h1 class="section-title" id="browse-title" style="font-size: 2.5rem;">Movie Catalog</h1>
    <div class="view-toggle" role="group" aria-label="View mode">
      <button class="view-btn active" id="view-grid" aria-label="Grid view" title="Grid view">⊞</button>
      <button class="view-btn" id="view-list" aria-label="List view" title="List view">☰</button>
    </div>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar" role="group" aria-label="Filter movies">
    <div class="filter-group">
      <label class="filter-label" for="f-type">Format</label>
      <select id="f-type" class="filter-select">
        <option value="">All Formats</option>
        <option value="movie">Movies</option>
        <option value="anime">Anime</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="f-genre">Genre</label>
      <select id="f-genre" class="filter-select">
        <option value="">All Genres</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="f-lang">Language</label>
      <select id="f-lang" class="filter-select">
        <option value="">All Languages</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="f-rating">Min Rating</label>
      <select id="f-rating" class="filter-select">
        <option value="">Any</option>
        <option value="9">9+ ⭐</option>
        <option value="8">8+ ⭐</option>
        <option value="7">7+ ⭐</option>
        <option value="6">6+ ⭐</option>
        <option value="5">5+ ⭐</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="f-year">Era</label>
      <select id="f-year" class="filter-select" aria-label="Filter by year">
        <option value="">All Years</option>
        <option value="2020">2020s</option>
        <option value="2010">2010s</option>
        <option value="2000">2000s</option>
        <option value="1990">1990s</option>
        <option value="0">Before 1990</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="f-sort">Sort By</label>
      <select id="f-sort" class="filter-select">
        <option value="popularity">Popularity</option>
        <option value="rating">Top Rated</option>
        <option value="year-new">Newest First</option>
        <option value="year-old">Oldest First</option>
        <option value="title-az">Title A→Z</option>
        <option value="title-za">Title Z→A</option>
        <option value="votes">Most Voted</option>
      </select>
    </div>
    <button class="reset-filters-btn" id="reset-filters">↺ Reset</button>
    <div class="result-count" id="result-count" aria-live="polite">Loading...</div>
  </div>

  <!-- Grid -->
  <div class="cards-grid" id="movies-grid" role="list"></div>

  <!-- Pagination Controls -->
  <div class="pagination-wrap" id="pagination-wrap" style="display:flex; justify-content:center; align-items:center; gap:8px; margin-top:40px;">
    <button class="page-btn" id="page-prev" disabled>‹ Prev</button>
    <div id="page-numbers" style="display:flex; gap:4px;"></div>
    <button class="page-btn" id="page-next" disabled>Next ›</button>
  </div>
</section>

<!-- ======================== FOOTER ======================== -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">CineVault</span>
    </div>
    <p class="footer-note">
      Data from the TMDB 5000 Movie Dataset. Torrent links redirect to third-party search pages.
    </p>
    <p class="footer-copy">© 2025 CineVault</p>
  </div>
</footer>

<!-- ======================== MODAL ======================== -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <button class="modal-close-btn" id="modal-close-btn">✕</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ======================== BACK TO TOP ======================== -->
<button class="back-to-top" id="back-to-top">↑</button>

<script src="petals.js" defer></script>
<!-- HLS.js loaded on-demand when Direct HLS source is selected (see app.js loadHlsJs) -->
<script src="app.js?v=4" defer></script>
</body>
</html>
